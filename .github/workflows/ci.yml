name: CI

on:
  pull_request:
    branches: [main, feature/enterprise-control-platform]
  push:
    branches: [feature/enterprise-control-platform]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start Supabase
        run: supabase start

      - name: Wait for local services
        run: npm run db:wait-local

      - name: Replay production migrations without fixtures
        run: supabase db reset --no-seed

      - name: Wait for reset services
        run: npm run db:wait-local

      - name: Verify production migration safety
        run: node scripts/assert-production-migrations-safe.mjs

      - name: Load explicit local personas
        run: npm run db:fixtures:local
        env:
          ALLOW_LOCAL_FIXTURES: "true"

      - name: Sync local environment
        run: node scripts/sync-local-env.cjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Database tests
        run: npm run test:db

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Build
        run: npm run build

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload authorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorization-matrix
          path: artifacts/authorization/
          if-no-files-found: error
          retention-days: 30

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
